name: Inspect INDONESIA RAR Chart Package

on:
  push:
    paths:
      - '.github/workflows/inspect-indonesia-rar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full sqlite3 file

      - name: Download Drive archive
        run: |
          python3 - <<'PY'
          import urllib.request
          url='https://drive.usercontent.google.com/download?id=1E79_eSV-4RARWxAZ96vNg2y1_b7D1HXT&export=download&confirm=t'
          out='/tmp/INDONESIA.rar'
          urllib.request.urlretrieve(url,out)
          print(out)
          PY
          ls -lh /tmp/INDONESIA.rar
          file /tmp/INDONESIA.rar
          sha256sum /tmp/INDONESIA.rar | tee /tmp/archive_sha256.txt

      - name: List archive
        run: |
          7z l -slt /tmp/INDONESIA.rar > /tmp/archive_list.txt
          {
            echo "=== ARCHIVE SUMMARY ==="
            ls -lh /tmp/INDONESIA.rar
            file /tmp/INDONESIA.rar
            cat /tmp/archive_sha256.txt
            echo
            echo "=== CANDIDATE FILES ==="
            grep -Ei '^Path = .*(\.mbtiles|\.sqlite|\.sqlite3|\.db|\.gemf|\.pmtiles|\.mvt|\.pbf|\.png|\.jpg|\.jpeg|\.webp)$' /tmp/archive_list.txt || true
            echo
            echo "=== TOP-LEVEL / FIRST 300 PATHS ==="
            grep '^Path = ' /tmp/archive_list.txt | head -300
          } > /tmp/report.txt

      - name: Extract MBTiles/SQLite candidates
        shell: bash
        run: |
          mkdir -p /tmp/extracted
          mapfile -t CANDS < <(grep '^Path = ' /tmp/archive_list.txt | sed 's/^Path = //' | grep -Ei '\.(mbtiles|sqlite|sqlite3|db)$' || true)
          echo "Candidate count: ${#CANDS[@]}" | tee -a /tmp/report.txt
          if [ "${#CANDS[@]}" -gt 0 ]; then
            for p in "${CANDS[@]}"; do
              echo "Extracting: $p" | tee -a /tmp/report.txt
              7z e -y /tmp/INDONESIA.rar "$p" -o/tmp/extracted >/tmp/extract.log 2>&1 || {
                cat /tmp/extract.log >> /tmp/report.txt
                continue
              }
            done
          fi

      - name: Inspect extracted databases
        run: |
          {
            echo
            echo "=== EXTRACTED DATABASE INSPECTION ==="
            find /tmp/extracted -maxdepth 1 -type f -printf '%f %s bytes\n' || true
            for f in /tmp/extracted/*; do
              [ -f "$f" ] || continue
              echo
              echo "--- $f ---"
              file "$f"
              if sqlite3 "$f" "PRAGMA schema_version;" >/dev/null 2>&1; then
                echo "SQLite: YES"
                echo "Tables:"
                sqlite3 -readonly "$f" ".tables" || true
                echo "Metadata:"
                sqlite3 -readonly -header -column "$f" "SELECT name,value FROM metadata ORDER BY name;" 2>/dev/null || true
                echo "Tile zooms:"
                sqlite3 -readonly -header -column "$f" "SELECT zoom_level,COUNT(*) AS tiles FROM tiles GROUP BY zoom_level ORDER BY zoom_level;" 2>/dev/null || true
                echo "Tile sample:"
                sqlite3 -readonly -header -column "$f" "SELECT zoom_level,tile_column,tile_row,length(tile_data),hex(substr(tile_data,1,16)) FROM tiles LIMIT 5;" 2>/dev/null || true
              else
                echo "SQLite: NO"
              fi
            done
          } >> /tmp/report.txt

      - name: Print report
        run: cat /tmp/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: indonesia-rar-inspection
          path: |
            /tmp/report.txt
            /tmp/archive_list.txt
          retention-days: 1
