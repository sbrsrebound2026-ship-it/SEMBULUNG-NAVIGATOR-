name: Full V8 Production Integration

on:
  workflow_dispatch:
  push:
    branches:
      - full-v8-production-integration

permissions:
  contents: write

jobs:
  integrate-build-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bootstrap payload
        run: |
          test -f .bootstrap/v8_core_patched.tar.xz
          sha256sum .bootstrap/v8_core_patched.tar.xz

      - name: Preserve V10 lightweight source for audit
        run: |
          mkdir -p migration/v10-lightweight
          if [ -d app/src/main/java/com/sembulung ]; then
            cp -a app/src/main/java/com/sembulung migration/v10-lightweight/java-com-sembulung
          fi
          cp -f app/build.gradle migration/v10-lightweight/app-build.gradle 2>/dev/null || true
          cp -f build.gradle migration/v10-lightweight/root-build.gradle 2>/dev/null || true
          cp -f settings.gradle migration/v10-lightweight/settings.gradle 2>/dev/null || true

      - name: Materialize full production engine
        run: |
          rm -rf app/src/main/java/com/sembulung
          rm -f app/build.gradle build.gradle settings.gradle
          tar -xJf .bootstrap/v8_core_patched.tar.xz
          chmod +x gradlew scripts/*.sh
          # Integration build follows the current repo generation instead of calling this V8.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=s.replace('versionCode = 8', 'versionCode = 11')
          s=s.replace('versionName = "0.8.0-production-enc"', 'versionName = "0.11.0-full-production-integration"')
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Structural safety QC
        run: ./scripts/verify_project.sh

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build full debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: APK checksum
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          sha256sum "$APK" | tee FULL_ENGINE_APK_SHA256.txt
          ls -lh "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-full-production-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            FULL_ENGINE_APK_SHA256.txt
          retention-days: 30

      - name: Materialize tested source into integration branch
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/full-v8-bootstrap.yml
          git config user.name "sembulung-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate full production navigation engine after CI verification"
          git push origin HEAD:full-v8-production-integration
