name: Build SEMBULUNG NAVIGATOR APK

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build signed release APK'
        required: false
        default: false
        type: boolean
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-v10-debug
          path: app/build/outputs/apk/debug/*.apk

  build-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SEMBULUNG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > sembulung-release.jks
      - name: Build signed release APK
        env:
          SEMBULUNG_STORE_FILE: sembulung-release.jks
          SEMBULUNG_STORE_PASSWORD: ${{ secrets.SEMBULUNG_STORE_PASSWORD }}
          SEMBULUNG_KEY_ALIAS: ${{ secrets.SEMBULUNG_KEY_ALIAS }}
          SEMBULUNG_KEY_PASSWORD: ${{ secrets.SEMBULUNG_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify expected release certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APKSIGNER" && test -n "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          EXPECTED="A59D35A100AA9694708A867764F68384F14CBE84E9892AEA3C9441EB476D31A8"
          ACTUAL=$(grep -i 'Signer #1 certificate SHA-256 digest:' cert.txt | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
      - name: Generate SHA256
        run: sha256sum app/build/outputs/apk/release/*.apk > APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-v10-release
          path: |
            app/build/outputs/apk/release/*.apk
            APK_SHA256.txt
            cert.txt
