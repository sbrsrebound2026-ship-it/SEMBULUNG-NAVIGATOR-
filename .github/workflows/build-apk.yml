name: Build SEMBULUNG NAVIGATOR V16 APK

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed release APK using configured release keystore secrets'
        required: false
        default: false
        type: boolean
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build V16 debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-v16-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SEMBULUNG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > sembulung-v16-release.jks

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed V16 release APK
        env:
          SEMBULUNG_STORE_FILE: sembulung-v16-release.jks
          SEMBULUNG_STORE_PASSWORD: ${{ secrets.SEMBULUNG_STORE_PASSWORD }}
          SEMBULUNG_KEY_ALIAS: ${{ secrets.SEMBULUNG_KEY_ALIAS }}
          SEMBULUNG_KEY_PASSWORD: ${{ secrets.SEMBULUNG_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify permanent release certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee cert.txt
          EXPECTED="BADFDF7F8C0031D82CDC20430A29ECD3F6E7D821FEE0478314D1128A6D5E887C"
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' cert.txt | head -1 | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Generate SHA256
        run: sha256sum app/build/outputs/apk/release/*.apk > APK_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-v16-release
          path: |
            app/build/outputs/apk/release/*.apk
            APK_SHA256.txt
            cert.txt
          retention-days: 30
