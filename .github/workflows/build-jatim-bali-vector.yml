name: Build Detailed Jatim Bali Vector Tiles

on:
  push:
    paths:
      - '.github/workflows/build-jatim-bali-vector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3
          curl -L --fail --retry 3 \
            -o /tmp/pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf /tmp/pmtiles.tar.gz -C /tmp
          sudo install -m 0755 /tmp/pmtiles /usr/local/bin/pmtiles
          pmtiles version

      - name: Download Geofabrik Shortbread MBTiles
        run: |
          curl -L --fail --retry 3 -o /tmp/java.mbtiles \
            https://download.geofabrik.de/asia/indonesia/java-shortbread-1.0.mbtiles
          curl -L --fail --retry 3 -o /tmp/nusa.mbtiles \
            https://download.geofabrik.de/asia/indonesia/nusa-tenggara-shortbread-1.0.mbtiles
          ls -lh /tmp/java.mbtiles /tmp/nusa.mbtiles

      - name: Inspect sources
        run: |
          echo "=== JAVA METADATA ==="
          sqlite3 -readonly -header -column /tmp/java.mbtiles "SELECT name,value FROM metadata ORDER BY name;" | head -100
          echo "=== NUSA METADATA ==="
          sqlite3 -readonly -header -column /tmp/nusa.mbtiles "SELECT name,value FROM metadata ORDER BY name;" | head -100

      - name: Crop and merge Jatim Bali
        run: |
          python3 - <<'PY'
          import sqlite3, math, os, json, hashlib
          sources=['/tmp/java.mbtiles','/tmp/nusa.mbtiles']
          dst='/tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.mbtiles'
          west,south,east,north=110.0,-9.5,116.5,-5.0

          def xyz(lat,lon,z):
              n=2**z
              x=int(math.floor((lon+180.0)/360.0*n))
              lat=max(-85.05112878,min(85.05112878,lat))
              y=int(math.floor((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n))
              return max(0,min(n-1,x)),max(0,min(n-1,y))

          if os.path.exists(dst): os.remove(dst)
          out=sqlite3.connect(dst)
          out.execute('PRAGMA journal_mode=OFF')
          out.execute('PRAGMA synchronous=OFF')
          out.execute('CREATE TABLE metadata (name text, value text)')
          out.execute('CREATE TABLE tiles (zoom_level integer, tile_column integer, tile_row integer, tile_data blob)')
          out.execute('CREATE UNIQUE INDEX tile_index ON tiles (zoom_level,tile_column,tile_row)')

          source_meta={}
          counts={}
          for idx,src in enumerate(sources):
              alias=f's{idx}'
              out.execute(f"ATTACH DATABASE ? AS {alias}",(src,))
              meta=dict(out.execute(f'SELECT name,value FROM {alias}.metadata').fetchall())
              if not source_meta: source_meta=meta
              zooms=[r[0] for r in out.execute(f'SELECT DISTINCT zoom_level FROM {alias}.tiles ORDER BY zoom_level')]
              for z in zooms:
                  n=2**z
                  x0,_=xyz(0,west,z)
                  x1,_=xyz(0,east,z)
                  _,y_north=xyz(north,0,z)
                  _,y_south=xyz(south,0,z)
                  row_min=n-1-y_south
                  row_max=n-1-y_north
                  before=out.total_changes
                  out.execute(f'''
                    INSERT OR IGNORE INTO tiles(zoom_level,tile_column,tile_row,tile_data)
                    SELECT zoom_level,tile_column,tile_row,tile_data
                    FROM {alias}.tiles
                    WHERE zoom_level=? AND tile_column BETWEEN ? AND ? AND tile_row BETWEEN ? AND ?
                  ''',(z,min(x0,x1),max(x0,x1),min(row_min,row_max),max(row_min,row_max)))
                  counts[z]=counts.get(z,0)+(out.total_changes-before)
              out.commit()
              out.execute(f'DETACH DATABASE {alias}')

          nonempty=[r[0] for r in out.execute('SELECT DISTINCT zoom_level FROM tiles ORDER BY zoom_level')]
          md={k:v for k,v in source_meta.items() if k not in ('name','bounds','center','minzoom','maxzoom')}
          md.update({
              'name':'SEMBULUNG JATIM BALI Shortbread',
              'bounds':f'{west},{south},{east},{north}',
              'center':'114.2,-7.9,9',
              'minzoom':str(min(nonempty) if nonempty else 0),
              'maxzoom':str(max(nonempty) if nonempty else 14),
              'source':'Geofabrik Shortbread 1.0 / OpenStreetMap',
              'attribution':'© OpenStreetMap contributors / Geofabrik'
          })
          out.executemany('INSERT INTO metadata(name,value) VALUES(?,?)',md.items())
          out.commit()
          out.execute('VACUUM')
          out.close()

          size=os.path.getsize(dst)
          sha=hashlib.sha256(open(dst,'rb').read()).hexdigest()
          report={
              'file':os.path.basename(dst),
              'bounds':[west,south,east,north],
              'zooms':nonempty,
              'tiles_by_zoom':{},
              'size_bytes':size,
              'sha256':sha
          }
          con=sqlite3.connect(dst)
          report['tiles_by_zoom']={str(z):c for z,c in con.execute('SELECT zoom_level,COUNT(*) FROM tiles GROUP BY zoom_level ORDER BY zoom_level')}
          con.close()
          open('/tmp/REPORT_VECTOR.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

      - name: Validate vector MBTiles
        run: |
          DB=/tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.mbtiles
          file "$DB"
          sqlite3 -readonly "$DB" ".tables"
          sqlite3 -readonly -header -column "$DB" "SELECT name,value FROM metadata WHERE name IN ('name','format','bounds','minzoom','maxzoom','json') ORDER BY name;" | head -120
          sqlite3 -readonly -header -column "$DB" "SELECT zoom_level,COUNT(*) tiles FROM tiles GROUP BY zoom_level ORDER BY zoom_level;"
          sqlite3 -readonly -header -column "$DB" "SELECT zoom_level,length(tile_data),hex(substr(tile_data,1,8)) FROM tiles LIMIT 5;"
          ls -lh "$DB"

      - name: Convert MBTiles to PMTiles
        run: |
          pmtiles convert /tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.mbtiles /tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.pmtiles
          pmtiles show /tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.pmtiles | head -120
          ls -lh /tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.pmtiles
          sha256sum /tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.pmtiles > /tmp/PMTILES_SHA256.txt

      - name: Package
        run: |
          mkdir -p /tmp/export
          cp /tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.mbtiles /tmp/export/
          cp /tmp/SEMBULUNG_JATIM_BALI_SHORTBREAD.pmtiles /tmp/export/
          cp /tmp/REPORT_VECTOR.json /tmp/export/
          cp /tmp/PMTILES_SHA256.txt /tmp/export/
          cat > /tmp/export/README.txt <<'EOF'
          SEMBULUNG NAVIGATOR - JATIM BALI DETAIL VECTOR
          Source: Geofabrik Shortbread 1.0 / OpenStreetMap
          Bounds: 110E..116.5E, 9.5S..5S
          Includes: East Java, Banyuwangi, Bali and surrounding area.
          MBTiles = source/archive format.
          PMTiles = preferred local MapLibre format for V23+.
          Attribution required: © OpenStreetMap contributors / Geofabrik.
          This is not an official hydrographic chart and must not be treated as a sole source for navigation safety.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-JATIM-BALI-DETAILED-VECTOR
          path: /tmp/export/
          retention-days: 1
