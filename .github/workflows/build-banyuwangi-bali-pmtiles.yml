name: Build Banyuwangi Bali Detailed PMTiles

on:
  push:
    paths:
      - '.github/workflows/build-banyuwangi-bali-pmtiles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3
          curl -L --fail --retry 3 \
            -o /tmp/pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf /tmp/pmtiles.tar.gz -C /tmp
          sudo install -m 0755 /tmp/pmtiles /usr/local/bin/pmtiles

      - name: Download Java Shortbread
        run: |
          curl -L --fail --retry 3 -o /tmp/java.mbtiles \
            https://download.geofabrik.de/asia/indonesia/java-shortbread-1.0.mbtiles
          ls -lh /tmp/java.mbtiles

      - name: Crop Banyuwangi Bali
        run: |
          python3 - <<'PY'
          import sqlite3, math, os, json, hashlib
          src='/tmp/java.mbtiles'
          dst='/tmp/SEMBULUNG_BANYUWANGI_BALI_DETAIL.mbtiles'
          west,south,east,north=113.0,-9.2,116.0,-7.0

          def xyz(lat,lon,z):
              n=2**z
              x=int(math.floor((lon+180.0)/360.0*n))
              lat=max(-85.05112878,min(85.05112878,lat))
              y=int(math.floor((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n))
              return max(0,min(n-1,x)),max(0,min(n-1,y))

          if os.path.exists(dst): os.remove(dst)
          inp=sqlite3.connect(f'file:{src}?mode=ro',uri=True)
          out=sqlite3.connect(dst)
          out.execute('PRAGMA journal_mode=OFF')
          out.execute('PRAGMA synchronous=OFF')
          out.execute('CREATE TABLE metadata (name text, value text)')
          out.execute('CREATE TABLE tiles (zoom_level integer, tile_column integer, tile_row integer, tile_data blob)')
          out.execute('CREATE UNIQUE INDEX tile_index ON tiles (zoom_level,tile_column,tile_row)')

          meta=dict(inp.execute('SELECT name,value FROM metadata').fetchall())
          zooms=[r[0] for r in inp.execute('SELECT DISTINCT zoom_level FROM tiles ORDER BY zoom_level')]
          counts={}
          for z in zooms:
              n=2**z
              x0,_=xyz(0,west,z); x1,_=xyz(0,east,z)
              _,yn=xyz(north,0,z); _,ys=xyz(south,0,z)
              r0=n-1-ys; r1=n-1-yn
              cur=inp.execute('''
                SELECT zoom_level,tile_column,tile_row,tile_data FROM tiles
                WHERE zoom_level=? AND tile_column BETWEEN ? AND ? AND tile_row BETWEEN ? AND ?
              ''',(z,min(x0,x1),max(x0,x1),min(r0,r1),max(r0,r1)))
              inserted=0
              while True:
                  rows=cur.fetchmany(1000)
                  if not rows: break
                  before=out.total_changes
                  out.executemany('INSERT OR IGNORE INTO tiles VALUES(?,?,?,?)',rows)
                  inserted += out.total_changes-before
              counts[z]=inserted
              out.commit()

          nonempty=[z for z,c in counts.items() if c>0]
          md={k:v for k,v in meta.items() if k not in ('name','bounds','center','minzoom','maxzoom')}
          md.update({
            'name':'SEMBULUNG Banyuwangi Bali Detail',
            'bounds':f'{west},{south},{east},{north}',
            'center':'114.85,-8.25,10',
            'minzoom':str(min(nonempty)),
            'maxzoom':str(max(nonempty)),
            'source':'Geofabrik Shortbread 1.0 / OpenStreetMap',
            'attribution':'© OpenStreetMap contributors / Geofabrik'
          })
          out.executemany('INSERT INTO metadata(name,value) VALUES(?,?)',md.items())
          out.commit(); out.execute('VACUUM'); out.close(); inp.close()

          sha=hashlib.sha256(open(dst,'rb').read()).hexdigest()
          con=sqlite3.connect(dst)
          report={
            'file':os.path.basename(dst),
            'bounds':[west,south,east,north],
            'zooms':nonempty,
            'tiles_by_zoom':{str(z):c for z,c in con.execute('SELECT zoom_level,COUNT(*) FROM tiles GROUP BY zoom_level ORDER BY zoom_level')},
            'size_bytes':os.path.getsize(dst),
            'sha256':sha
          }
          con.close()
          open('/tmp/REPORT.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

      - name: Convert to PMTiles
        run: |
          pmtiles convert /tmp/SEMBULUNG_BANYUWANGI_BALI_DETAIL.mbtiles /tmp/SEMBULUNG_BANYUWANGI_BALI_DETAIL.pmtiles
          pmtiles show /tmp/SEMBULUNG_BANYUWANGI_BALI_DETAIL.pmtiles | tee /tmp/PMTILES_INFO.txt
          sha256sum /tmp/SEMBULUNG_BANYUWANGI_BALI_DETAIL.pmtiles > /tmp/PMTILES_SHA256.txt
          ls -lh /tmp/SEMBULUNG_BANYUWANGI_BALI_DETAIL.*

      - name: Prepare docs
        run: |
          cat > /tmp/README.txt <<'EOF'
          SEMBULUNG NAVIGATOR - BANYUWANGI BALI DETAIL
          Bounds: 113E..116E, 9.2S..7S
          Coverage target: East Java coast, Banyuwangi, Selat Bali, Bali.
          Source: Geofabrik Shortbread 1.0 / OpenStreetMap.
          PMTiles: import with SEMBULUNG NAVIGATOR V23 > PETA DETAIL VECTOR > IMPOR .PMTILES.
          MBTiles: source vector archive / future-compatible.
          Attribution: © OpenStreetMap contributors / Geofabrik.
          Not an official hydrographic chart; do not use as the sole source for navigation safety.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-BANYUWANGI-BALI-PMTILES
          path: |
            /tmp/SEMBULUNG_BANYUWANGI_BALI_DETAIL.pmtiles
            /tmp/PMTILES_SHA256.txt
            /tmp/PMTILES_INFO.txt
            /tmp/README.txt
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-BANYUWANGI-BALI-MBTILES
          path: |
            /tmp/SEMBULUNG_BANYUWANGI_BALI_DETAIL.mbtiles
            /tmp/REPORT.json
            /tmp/README.txt
          compression-level: 0
          retention-days: 1
