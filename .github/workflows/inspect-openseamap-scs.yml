name: Inspect OpenSeaMap South China Sea MBTiles

on:
  push:
    paths:
      - '.github/workflows/inspect-openseamap-scs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download current OpenSeaMap South Chinese Sea MBTiles
        run: |
          set -euxo pipefail
          URL="https://ftp.gwdg.de/pub/misc/openstreetmap/openseamap/charts/mbtiles/OSM-OpenCPN2-SouthChineseSea.mbtiles"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
            -o /tmp/SouthChineseSea.mbtiles "$URL"
          ls -lh /tmp/SouthChineseSea.mbtiles
          file /tmp/SouthChineseSea.mbtiles

      - name: Inspect MBTiles
        run: |
          python3 - <<'PY'
          import sqlite3, math, os, hashlib, struct, json
          db="/tmp/SouthChineseSea.mbtiles"
          out="OPEN_SEAMAP_SCS_QC.txt"

          con=sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          cur=con.cursor()

          def one(sql,args=()):
              r=cur.execute(sql,args).fetchone()
              return r[0] if r else None

          tables=[r[0] for r in cur.execute("SELECT name FROM sqlite_master WHERE type IN ('table','view') ORDER BY name")]
          meta={}
          if "metadata" in tables:
              for k,v in cur.execute("SELECT name,value FROM metadata"):
                  meta[str(k)]=str(v)

          zstats=[]
          if "tiles" in tables:
              zstats=list(cur.execute("""
                SELECT zoom_level, COUNT(*), MIN(tile_column), MAX(tile_column), MIN(tile_row), MAX(tile_row),
                       MIN(length(tile_data)), MAX(length(tile_data)), CAST(AVG(length(tile_data)) AS INTEGER)
                FROM tiles GROUP BY zoom_level ORDER BY zoom_level
              """))

          first=cur.execute("SELECT tile_data FROM tiles LIMIT 1").fetchone()
          sig=bytes(first[0][:16]) if first and first[0] else b""
          if sig.startswith(b"\x89PNG\r\n\x1a\n"):
              tile_format="PNG"
          elif sig.startswith(b"\xff\xd8\xff"):
              tile_format="JPEG"
          elif sig.startswith(b"RIFF") and b"WEBP" in sig:
              tile_format="WEBP"
          else:
              tile_format="UNKNOWN/BINARY "+sig.hex()

          points=[
              ("Banyuwangi",-8.2192,114.3691),
              ("Bali",-8.4095,115.1889),
              ("Surabaya",-7.2575,112.7521),
              ("Jakarta",-6.2088,106.8456),
              ("Natuna",3.9500,108.3800),
              ("Pontianak",-0.0263,109.3425),
              ("Makassar",-5.1477,119.4327),
              ("Batam",1.1301,104.0529),
              ("Tarakan",3.3000,117.6333),
          ]

          zooms=[int(r[0]) for r in zstats]

          def xyz(lat,lon,z):
              n=2**z
              x=int((lon+180.0)/360.0*n)
              lat=max(min(lat,85.05112878),-85.05112878)
              yr=(1.0-math.asinh(math.tan(math.radians(lat)))/math.pi)/2.0*n
              y=int(yr)
              return x,y

          point_rows=[]
          for name,lat,lon in points:
              hits=[]
              for z in zooms:
                  x,yxyz=xyz(lat,lon,z)
                  ytms=(2**z-1)-yxyz
                  ok=cur.execute(
                      "SELECT 1 FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=? LIMIT 1",
                      (z,x,ytms)).fetchone() is not None
                  if ok:
                      hits.append(z)
              point_rows.append((name,lat,lon,hits))

          size=os.path.getsize(db)
          total=one("SELECT COUNT(*) FROM tiles") if "tiles" in tables else None
          minz=one("SELECT MIN(zoom_level) FROM tiles") if "tiles" in tables else None
          maxz=one("SELECT MAX(zoom_level) FROM tiles") if "tiles" in tables else None

          with open(out,"w",encoding="utf-8") as f:
              f.write("OPENSeaMap South Chinese Sea MBTiles QC\n")
              f.write("="*60+"\n")
              f.write(f"File bytes: {size}\n")
              f.write(f"SQLite tables/views: {', '.join(tables)}\n")
              f.write(f"Tile format detected: {tile_format}\n")
              f.write(f"Total tiles: {total}\n")
              f.write(f"Zoom range in tiles: {minz}..{maxz}\n\n")
              f.write("METADATA\n")
              for k in sorted(meta):
                  f.write(f"{k}={meta[k]}\n")
              f.write("\nZOOM STATISTICS\n")
              f.write("z count minX maxX minRow maxRow minBytes maxBytes avgBytes\n")
              for r in zstats:
                  f.write(" ".join(map(str,r))+"\n")
              f.write("\nINDONESIA POINT COVERAGE (actual tile existence)\n")
              for name,lat,lon,hits in point_rows:
                  f.write(f"{name}: {lat:.4f},{lon:.4f} -> ")
                  if hits:
                      f.write("YES; zooms="+",".join(map(str,hits))+"\n")
                  else:
                      f.write("NO TILE AT ANY STORED ZOOM\n")

              standard=("metadata" in tables and "tiles" in tables)
              raster=tile_format in ("PNG","JPEG","WEBP")
              f.write("\nCOMPATIBILITY\n")
              f.write(f"Standard metadata+tiles schema: {standard}\n")
              f.write(f"Raster tile payload: {raster}\n")
              f.write("SEMBULUNG V21 expected: raster MBTiles with metadata/tiles and TMS rows.\n")
              f.write(f"Initial compatibility verdict: {'COMPATIBLE' if standard and raster else 'NEEDS ADAPTER'}\n")

          # Extract one representative Indonesian tile if available, preferring Natuna.
          for name,lat,lon,hits in point_rows:
              if not hits:
                  continue
              z=max(hits)
              x,yxyz=xyz(lat,lon,z)
              ytms=(2**z-1)-yxyz
              row=cur.execute(
                  "SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=? LIMIT 1",
                  (z,x,ytms)).fetchone()
              if row:
                  ext={"PNG":"png","JPEG":"jpg","WEBP":"webp"}.get(tile_format,"bin")
                  with open(f"sample_{name}_z{z}.{ext}","wb") as sf:
                      sf.write(row[0])
                  break

          con.close()
          print(open(out,encoding="utf-8").read())
          PY

      - name: Upload QC only
        uses: actions/upload-artifact@v4
        with:
          name: openseamap-south-china-sea-qc
          path: |
            OPEN_SEAMAP_SCS_QC.txt
            sample_*
          if-no-files-found: error
          retention-days: 1
