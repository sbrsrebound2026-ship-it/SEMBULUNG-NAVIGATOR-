name: Build Jatim Bali OpenSeaMap MBTiles

on:
  push:
    paths:
      - '.github/workflows/build-jatim-bali-mbtiles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - name: Download official OpenSeaMap MBTiles
        run: |
          curl -L --fail --retry 3 --retry-delay 5             -o /tmp/source.mbtiles             https://ftp.gwdg.de/pub/misc/openstreetmap/openseamap/charts/mbtiles/OSM-OpenCPN2-SouthChineseSea.mbtiles

      - name: Crop East Java Bali region
        run: |
          python3 - <<'PY'
          import sqlite3, math, os, hashlib, json

          SRC='/tmp/source.mbtiles'
          DST='/tmp/SEMBULUNG_JATIM_BALI_OpenSeaMap.mbtiles'
          WEST,SOUTH,EAST,NORTH=110.0,-9.5,116.5,-5.0

          def xyz(lat,lon,z):
              n=2**z
              x=int(math.floor((lon+180.0)/360.0*n))
              lat=max(-85.05112878,min(85.05112878,lat))
              y=int(math.floor((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n))
              return max(0,min(n-1,x)),max(0,min(n-1,y))

          if os.path.exists(DST): os.remove(DST)
          out=sqlite3.connect(DST)
          out.execute('PRAGMA journal_mode=OFF')
          out.execute('PRAGMA synchronous=OFF')
          out.execute('CREATE TABLE metadata (name text, value text)')
          out.execute('CREATE TABLE tiles (zoom_level integer, tile_column integer, tile_row integer, tile_data blob)')
          out.execute("ATTACH DATABASE ? AS src",(SRC,))

          zooms=[r[0] for r in out.execute('SELECT DISTINCT zoom_level FROM src.tiles ORDER BY zoom_level')]
          counts={}
          for z in zooms:
              n=2**z
              x0,_=xyz(0,WEST,z)
              x1,_=xyz(0,EAST,z)
              _,y_north=xyz(NORTH,0,z)
              _,y_south=xyz(SOUTH,0,z)
              # MBTiles standard storage uses TMS rows.
              row_min=n-1-y_south
              row_max=n-1-y_north
              out.execute('''
                INSERT INTO tiles(zoom_level,tile_column,tile_row,tile_data)
                SELECT zoom_level,tile_column,tile_row,tile_data
                FROM src.tiles
                WHERE zoom_level=? AND tile_column BETWEEN ? AND ? AND tile_row BETWEEN ? AND ?
              ''',(z,min(x0,x1),max(x0,x1),min(row_min,row_max),max(row_min,row_max)))
              counts[z]=out.execute('SELECT COUNT(*) FROM tiles WHERE zoom_level=?',(z,)).fetchone()[0]

          nonempty=[z for z,c in counts.items() if c>0]
          source_meta=dict(out.execute('SELECT name,value FROM src.metadata').fetchall())
          meta={
            'name':'SEMBULUNG JATIM BALI OpenSeaMap',
            'type':'baselayer',
            'format':'png',
            'scheme':'tms',
            'bounds':f'{WEST},{SOUTH},{EAST},{NORTH}',
            'center':f'114.2,-7.9,{nonempty[len(nonempty)//2] if nonempty else 8}',
            'minzoom':str(min(nonempty) if nonempty else 8),
            'maxzoom':str(max(nonempty) if nonempty else 8),
            'available_zooms':','.join(map(str,nonempty)),
            'source':'OpenSeaMap OSM-OpenCPN2-SouthChineseSea',
            'source_date':source_meta.get('date',''),
            'attribution':'OpenSeaMap / OpenStreetMap contributors'
          }
          out.executemany('INSERT INTO metadata(name,value) VALUES(?,?)',meta.items())
          out.execute('CREATE UNIQUE INDEX tile_index ON tiles (zoom_level,tile_column,tile_row)')
          out.commit()
          out.execute('VACUUM')
          out.close()

          sha=hashlib.sha256(open(DST,'rb').read()).hexdigest()
          report={
            'file':os.path.basename(DST),
            'bounds':[WEST,SOUTH,EAST,NORTH],
            'source_zooms':zooms,
            'selected_tile_counts':counts,
            'nonempty_zooms':nonempty,
            'size_bytes':os.path.getsize(DST),
            'sha256':sha,
          }
          open('/tmp/REPORT.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

      - name: Validate cropped MBTiles
        run: |
          DB=/tmp/SEMBULUNG_JATIM_BALI_OpenSeaMap.mbtiles
          file "$DB"
          sqlite3 -readonly "$DB" ".tables"
          sqlite3 -readonly -header -column "$DB" "SELECT name,value FROM metadata ORDER BY name;"
          sqlite3 -readonly -header -column "$DB" "SELECT zoom_level,COUNT(*) tiles FROM tiles GROUP BY zoom_level ORDER BY zoom_level;"
          ls -lh "$DB"

      - name: Package
        run: |
          mkdir -p /tmp/export
          cp /tmp/SEMBULUNG_JATIM_BALI_OpenSeaMap.mbtiles /tmp/export/
          cp /tmp/REPORT.json /tmp/export/
          cat > /tmp/export/README.txt <<'EOF'
          SEMBULUNG NAVIGATOR - JATIM BALI OpenSeaMap MBTiles
          Area: Jawa Timur - Banyuwangi - Selat Bali - Bali
          Source: OpenSeaMap SouthChineseSea official MBTiles
          Format: raster PNG MBTiles / TMS
          Import: SEMBULUNG NAVIGATOR > PETA OFFLINE > IMPOR PETA
          Note: detail is limited by the source chart coverage. This package does not contain Navionics proprietary charts.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-JATIM-BALI-OpenSeaMap-MBTiles
          path: /tmp/export/
          retention-days: 1
