name: FINAL SIGN SEMBULUNG NAVIGATOR 3.0

on:
  push:
    paths:
      - '.github/workflows/final-local-sign.yml'

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch temporary private signing backup
        run: |
          curl -L --fail --retry 3 -o /tmp/signing.zip 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-26f0-81f4-9d43-d6c7e299d71d/raw?se=2026-09-23T17%3A42%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=2acc9154-c8cf-57e5-a2f5-9551bedaec39&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T02%3A45%3A37Z&ske=2026-09-24T02%3A45%3A37Z&sks=b&skv=2026-02-06&sig=lSaX0wkA8tjkQvRqlVAbPzpU1SUd%2Ba77epDHPB8Upto%3D'
          mkdir -p /tmp/signing
          unzip -q /tmp/signing.zip -d /tmp/signing
          test -n "$(find /tmp/signing -type f \( -name '*.jks' -o -name '*.keystore' \) | head -1)"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease

      - name: Align sign and verify final APK
        shell: bash
        run: |
          cat > /tmp/sign_final.py <<'PY'
          import os,re,glob,subprocess,hashlib,sys

          signroot='/tmp/signing'
          jks=glob.glob(signroot+'/**/*.jks',recursive=True)+glob.glob(signroot+'/**/*.keystore',recursive=True)
          if not jks: raise SystemExit('keystore missing')
          jks=jks[0]

          vals={}
          for p in glob.glob(signroot+'/**/*.txt',recursive=True):
              try: txt=open(p,encoding='utf-8',errors='ignore').read()
              except: continue
              for line in txt.splitlines():
                  m=re.match(r'^\s*([A-Za-z0-9_. -]+?)\s*[:=]\s*(.+?)\s*$',line)
                  if not m: continue
                  k=re.sub(r'[^a-z0-9]','',m.group(1).lower())
                  vals[k]=m.group(2).strip().strip('"').strip("'")

          def pick(*keys):
              for k in keys:
                  kk=re.sub(r'[^a-z0-9]','',k.lower())
                  if vals.get(kk): return vals[kk]
              return None

          store=pick('storePassword','keystorePassword','storepass','keystore password','password')
          alias=pick('keyAlias','alias','key alias')
          keypass=pick('keyPassword','keypass','key password') or store
          if not (store and alias and keypass):
              raise SystemExit('credential parse failed')

          sdk=os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT')
          aps=sorted(glob.glob(sdk+'/build-tools/*/apksigner'))
          zas=sorted(glob.glob(sdk+'/build-tools/*/zipalign'))
          aapts=sorted(glob.glob(sdk+'/build-tools/*/aapt'))
          if not (aps and zas and aapts): raise SystemExit('android build tools missing')
          apksigner,zipalign,aapt=aps[-1],zas[-1],aapts[-1]

          unsigned=glob.glob('app/build/outputs/apk/release/*.apk')
          if not unsigned: raise SystemExit('release apk missing')
          unsigned=unsigned[0]
          os.makedirs('final',exist_ok=True)
          aligned='/tmp/aligned.apk'
          final='final/SEMBULUNG_NAVIGATOR_3.0_FINAL.apk'

          subprocess.run([zipalign,'-f','-p','4',unsigned,aligned],check=True)

          env=os.environ.copy()
          env['SP']=store; env['KP']=keypass
          subprocess.run([
              apksigner,'sign','--ks',jks,'--ks-key-alias',alias,
              '--ks-pass','env:SP','--key-pass','env:KP',
              '--v1-signing-enabled','true','--v2-signing-enabled','true','--v3-signing-enabled','true',
              '--out',final,aligned
          ],check=True,env=env)

          v=subprocess.check_output([apksigner,'verify','--verbose','--print-certs',final],text=True)
          open('final/CERTIFICATE_VERIFY.txt','w').write(v)
          m=re.search(r'certificate SHA-256 digest:\s*([0-9a-fA-F:]+)',v)
          if not m: raise SystemExit('certificate digest missing')
          cert=m.group(1).replace(':','').upper()
          expected='BADFDF7F8C0031D82CDC20430A29ECD3F6E7D821FEE0478314D1128A6D5E887C'
          if cert!=expected: raise SystemExit('certificate fingerprint mismatch')

          bad=subprocess.check_output([aapt,'dump','badging',final],text=True)
          open('final/APK_BADGING.txt','w').write(bad)
          first=bad.splitlines()[0] if bad else ''
          if "name='com.sembulung.navigator'" not in first: raise SystemExit('package mismatch')
          if "versionCode='27'" not in first: raise SystemExit('versionCode mismatch')
          if "versionName='3.0.0-final'" not in first: raise SystemExit('versionName mismatch')

          sha=hashlib.sha256(open(final,'rb').read()).hexdigest()
          open('final/SHA256.txt','w').write(sha+'  SEMBULUNG_NAVIGATOR_3.0_FINAL.apk\n')
          open('final/INSTALL_README.txt','w').write('''SEMBULUNG NAVIGATOR 3.0 FINAL
          BY WONG MBRAYU
          Navigasi Laut Presisi

          Package: com.sembulung.navigator
          Version code: 27
          Version name: 3.0.0-final

          INSTALL
          1. Install SEMBULUNG_NAVIGATOR_3.0_FINAL.apk.
          2. Open app and copy Device Code.
          3. Generate Activation Key with private SEMBULUNG Key Admin.
          4. Activate device.
          5. Import Banyuwangi-Bali PMTiles in Unified Marine Map if needed.
          6. Allow location permission for live vessel navigation.

          FINAL FEATURES
          - Device-bound offline activation
          - Unified MapLibre marine map
          - Offline PMTiles + OpenSeaMap seamarks + optional GEBCO
          - GPS/NMEA SOG COG heading depth
          - Tap-to-route, DTG, bearing, XTE, ETA, auto-advance
          - Persistent track + GPX/KML export
          - AIS CPA/TCPA risk display + audible collision alarm
          - Sonar sounding + shallow-water and shallow-ahead warning
          - 0.5 / 1 / 2 NM range rings

          SAFETY
          Open data and user sonar data are navigation aids only.
          Use appropriate official hydrographic charts and normal seamanship for safety-critical navigation.
          ''')
          print('FINAL_APK_SHA256='+sha)
          print('SIGNER_SHA256='+cert)
          PY
          python3 /tmp/sign_final.py

      - name: Create distribution ZIP
        run: |
          cd final
          zip -9 ../SEMBULUNG_NAVIGATOR_3.0_FINAL_PACKAGE.zip *
          cd ..
          cp SEMBULUNG_NAVIGATOR_3.0_FINAL_PACKAGE.zip final/

      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-3.0-FINAL-SIGNED
          path: final/
          retention-days: 90
