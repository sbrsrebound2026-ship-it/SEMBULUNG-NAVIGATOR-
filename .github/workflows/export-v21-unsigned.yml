name: Export V21 Standalone Unsigned Release

on:
  push:
    paths:
      - '.github/workflows/export-v21-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build unsigned standalone release
        run: gradle --no-daemon :app:assembleRelease
      - name: Package release output
        run: |
          mkdir -p export
          cp app/build/outputs/apk/release/*.apk export/SEMBULUNG_NAVIGATOR_V21_STANDALONE_UNSIGNED.apk
          sha256sum export/*.apk > export/UNSIGNED_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-v21-standalone-unsigned
          path: export/
          retention-days: 1
