name: Export V25 Signed Release

on:
  push:
    paths:
      - '.github/workflows/export-v25-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent SEMBULUNG keystore
        env:
          KEYSTORE_B64: ${{ secrets.SEMBULUNG_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > sembulung-v25-release.jks

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed release
        env:
          SEMBULUNG_STORE_FILE: sembulung-v25-release.jks
          SEMBULUNG_STORE_PASSWORD: ${{ secrets.SEMBULUNG_STORE_PASSWORD }}
          SEMBULUNG_KEY_ALIAS: ${{ secrets.SEMBULUNG_KEY_ALIAS }}
          SEMBULUNG_KEY_PASSWORD: ${{ secrets.SEMBULUNG_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify certificate and APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee cert.txt
          EXPECTED="BADFDF7F8C0031D82CDC20430A29ECD3F6E7D821FEE0478314D1128A6D5E887C"
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' cert.txt | head -1 | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
          sha256sum "$APK" > APK_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-V25-SIGNED-RELEASE
          path: |
            app/build/outputs/apk/release/*.apk
            APK_SHA256.txt
            cert.txt
          retention-days: 30
