name: Export SEMBULUNG NAVIGATOR 3.0 FINAL Release

on:
  push:
    paths:
      - '.github/workflows/final-export-release.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease
      - name: Collect release
        run: |
          mkdir -p export
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" export/SEMBULUNG_NAVIGATOR_3.0_FINAL_UNSIGNED.apk
          sha256sum export/*.apk > export/UNSIGNED_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SEMBULUNG-NAVIGATOR-3.0-FINAL-UNSIGNED
          path: export/
          retention-days: 1
