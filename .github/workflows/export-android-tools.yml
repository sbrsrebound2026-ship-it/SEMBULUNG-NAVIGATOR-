name: Export Android Patch Tools

on:
  push:
    paths:
      - '.github/workflows/export-android-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download apktool
        run: |
          mkdir -p patch-tools
          curl -L --fail --retry 3 -o patch-tools/apktool.jar https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar
      - name: Package required tools
        run: |
          mkdir -p patch-tools/platform patch-tools/build-tools
          cp "$ANDROID_HOME/platforms/android-35/android.jar" patch-tools/platform/
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." patch-tools/build-tools/
          printf '%s\n' 'Android patch tools: apktool 2.10.0, android-35, build-tools 35.0.0' > patch-tools/README.txt
          zip -9 -r ANDROID_PATCH_TOOLS.zip patch-tools >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ANDROID-PATCH-TOOLS
          path: ANDROID_PATCH_TOOLS.zip
          retention-days: 1
