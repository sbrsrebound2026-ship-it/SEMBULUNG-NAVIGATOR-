name: Export Android Patch Tools

on:
  push:
    paths:
      - '.github/workflows/export-android-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          PLATFORM="$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' | sort -V | tail -1)"
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -f "$PLATFORM/android.jar"
          test -x "$BT/d8"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
          echo "BT=$BT" >> "$GITHUB_ENV"

      - name: Download apktool
        run: |
          mkdir -p patch-tools
          curl -L --fail --retry 3 -o patch-tools/apktool.jar https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar

      - name: Package required tools
        run: |
          mkdir -p patch-tools/platform patch-tools/build-tools
          cp "$PLATFORM/android.jar" patch-tools/platform/
          cp -a "$BT/." patch-tools/build-tools/
          printf '%s\n' 'Android patch tools: apktool 2.10.0 + runner platform/build-tools.' > patch-tools/README.txt
          zip -9 -r ANDROID_PATCH_TOOLS.zip patch-tools >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ANDROID-PATCH-TOOLS
          path: ANDROID_PATCH_TOOLS.zip
          retention-days: 1
